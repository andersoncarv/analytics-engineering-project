unit_tests:
  - name: test_stg_leads_tiebreak_and_deletion_flag
    description: >
      1) Empate no atualizado_em: vence a versão do arquivo mais recente.
      2) Lead ausente do arquivo mais recente continua no staging, com is_in_latest_file = false.
    model: stg_crm__leads
    given:
      - input: source('crm', 'leads')
        rows:
          - {lead_id: 'A001', status: 'novo',        atualizado_em: '01/10/2026 10:00', _source_file: 'leads_20261001.csv', _row_number: 2}
          - {lead_id: 'A001', status: 'qualificado', atualizado_em: '01/10/2026 10:00', _source_file: 'leads_20261002.csv', _row_number: 2}
          - {lead_id: 'B001', status: 'novo',        atualizado_em: '01/10/2026 09:00', _source_file: 'leads_20261001.csv', _row_number: 3}
    expect:
      rows:
        - {lead_id: 'A001', status: 'qualificado', _source_file: 'leads_20261002.csv', is_in_latest_file: true}
        - {lead_id: 'B001', status: 'novo',        _source_file: 'leads_20261001.csv', is_in_latest_file: false}